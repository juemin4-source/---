<text x="55" y="58" font-size="37" font-weight="700">永蚀 / 体验驱动地图 C · 审核剖面</text>
<text x="55" y="99" class="note">去程认识环境，回程重新理解环境。先审核地形与路线，不将图上的单位直接当游戏像素。</text>
<text x="55" y="137" class="small muted">浅色为通行空间；深色为实墙与设备。主路以平走、短跳与缓阶衔接；无长梯。所有标注都是待实现设计。</text><path d="M730 1390H810L945 1220H1025V1320H985L840 1500H730Z" class="walk"/><path d="M1110 1220H1350L1430 1280H1510V1380H1380L1300 1320H1110Z" class="walk"/><path d="M1080 1225V1160H990V1030H1080V1000H1260V1110H1170V1140H1180V1310H1080Z" class="walk"/><path d="M1870 1230V1110H1590V1190H1790V1310H1870Z" class="walk"/><path d="M1570 960H1670V820H1580V850H1520V960Z" class="walk"/><path d="M1750 780H1850V650H1750V555H1850V470H1760V490H1650V720H1750Z" class="walk"/><path d="M1660 635H1540V560H1450V650H1570V700H1660Z" class="walk"/><path d="M1780 805H1960V760H2180V850H2010V885H1780Z" class="walk"/><path d="M2240 475H2420V640L2320 740H2240V820H2360L2500 680V390H2240Z" class="walk"/><path d="M2160 880H2260L2170 990H1860V1060H1930L2150 1240H2240V1330H2100L1830 1110H1770V910H2110Z" class="walk"/><path d="M1590 1080H1800V1180H1590Z" class="walk"/><path d="M2300 900H2510V970L2420 1060V1150L2500 1230V1450H2320V1350H2400V1270L2320 1190V1020L2420 920H2300Z" class="walk"/><path d="M1040 1380H1110L1240 1130H1310V1220H1290L1170 1470H1040Z" class="walk"/><path d="M1520 1440H1190V1360H1090V1430H1130V1515H1570V1400H1520Z" class="walk"/><path d="M90 1390H270V1360H560V1380H760V1500H830V1590H90Z" class="walk"/><rect x="395" y="1525" width="90" height="65" class="solid"/><path d="M535 1470h125" stroke="#b1c5cd" stroke-width="7"/><text x="110" y="1428" class="room">气闸 / 普通物资撤离</text><text x="355" y="1414" class="room">01 维修工位</text><rect x="120" y="1500" width="35" height="90" fill="#7bb89e"/><path d="M560 1560l20 30h-40z" fill="#ed9281"/><path d="M617 1435l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="640" y="1456" class="tiny" style="fill:#e6bd71">首个器官试用支路</text><text x="343" y="1555" class="tiny">工作台</text><text x="510" y="1630" class="small">首次战斗留退路，不锁门</text><circle cx="235" cy="1540" r="8" fill="#fff0d5"/><path d="M235 1548v22m0-15l-12 10m12-10l12 10m-12 5l-10 15m10-15l10 15" stroke="#fff0d5" stroke-width="4"/><path d="M930 1190H1200V1220H1300V1320H925V1260H930Z" class="walk"/><path d="M880 1380H1100V1330H1170V1500H900V1470H830V1440H880Z" class="walk"/><text x="949" y="1226" class="room">02 排污观察口</text><path d="M952 1320H1060" stroke="#96d1e6" stroke-width="9" stroke-dasharray="13 5"/><path d="M850 1468q0-37 30-25q30-12 30 25z" fill="#725858" stroke="#d4877b" stroke-width="3"/><ellipse cx="965" cy="1490" rx="13" ry="10" fill="#c4c38b"/><path d="M1003 1495l13-10l11 8l13-5" stroke="#b99caa" stroke-width="7" fill="none"/><path d="M1080 1440l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="1103" y="1461" class="tiny" style="fill:#e6bd71">电池</text><text x="922" y="1353" class="tiny" style="fill:#96d1e6">隔窗先看，下去可退出</text><text x="1150" y="1280" class="room">03 分路</text><path d="M1090 1390h70" stroke="#b1c5cd" stroke-width="7"/><path d="M1095 1355h70" stroke="#b1c5cd" stroke-width="7"/><path d="M880 1070H950V955H1135V1000H1220V1090H1130V1190H1040V1150H950V1140H880Z" class="walk"/><rect x="980" y="1080" width="65" height="110" class="solid"/><path d="M965 1022h120" stroke="#b1c5cd" stroke-width="7"/><path d="M1100 1060h95" stroke="#b1c5cd" stroke-width="7"/><text x="925" y="990" class="room">维修路 / 较短</text><text x="872" y="1216" class="tiny">跳设备绕过食物区</text><path d="M1073 1180l13-10l11 8l13-5" stroke="#b99caa" stroke-width="7" fill="none"/><path d="M1160 1155l20 30h-40z" fill="#ed9281"/><path d="M1420 1220H1630V1190H1770V1220H1940V1310H1890V1460H1490V1410H1420Z" class="walk"/><rect x="1520" y="1360" width="65" height="100" class="solid"/><rect x="1695" y="1315" width="65" height="145" class="solid"/><rect x="1810" y="1400" width="80" height="60" class="solid"/><path d="M1500 1305h100" stroke="#b1c5cd" stroke-width="7"/><path d="M1660 1270h125" stroke="#b1c5cd" stroke-width="7"/><path d="M1800 1300h90" stroke="#b1c5cd" stroke-width="7"/><path d="M1630 1430l20 30h-40z" fill="#ed9281"/><path d="M1715 1230l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="1738" y="1251" class="tiny" style="fill:#e6bd71">可选宝箱兽</text><text x="1440" y="1255" class="room">装卸道 / 具体物资</text><text x="1490" y="1492" class="tiny">货架切断长射线 · 地面绕行</text><path d="M1220 850H1440V800H1580V870H1630V1190H1280V1140H1220Z" class="walk"/><path d="M1350 925H1450V960H1490V1100H1325V990H1350Z" class="solid"/><path d="M1280 912h230" stroke="#b1c5cd" stroke-width="7"/><path d="M1510 967h100" stroke="#b1c5cd" stroke-width="7"/><path d="M1250 1040h70" stroke="#b1c5cd" stroke-width="7"/><text x="1250" y="883" class="room">04 主泵厅</text><text x="1350" y="1025" class="room">泵体</text><ellipse cx="1295" cy="1125" rx="13" ry="10" fill="#c4c38b"/><path d="M1513 1185l13-10l11 8l13-5" stroke="#b99caa" stroke-width="7" fill="none"/><path d="M1560 937l20 30h-40z" fill="#ed9281"/><text x="1280" y="1225" class="tiny">从两侧进入同一地标；回程再经过侧缘</text><path d="M1590 735H1800V860H1680V835H1590Z" class="walk"/><text x="1608" y="769" class="room">05 泵后值守台</text><path d="M1700 794l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="1723" y="815" class="tiny" style="fill:#e6bd71">书籍 / 设施图</text><path d="M1595 834H1680" stroke="#96d1e6" stroke-width="7" stroke-dasharray="13 5"/><text x="1535" y="706" class="tiny">回望战场，整理后决定是否深入</text><path d="M1320 525H1515V645H1380V615H1320Z" class="walk"/><path d="M1360 560l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="1383" y="581" class="tiny" style="fill:#e6bd71">资料支路</text><text x="1325" y="676" class="tiny">带走书籍 / 蓝图</text><path d="M1700 350H1810V290H2030V340H2200V315H2330V480H2240V590H2040V550H1910V615H1750V555H1700Z" class="walk"/><rect x="1840" y="445" width="100" height="110" class="solid"/><rect x="2090" y="440" width="85" height="150" class="solid"/><path d="M1770 480h60" stroke="#b1c5cd" stroke-width="7"/><path d="M1915 399h120" stroke="#b1c5cd" stroke-width="7"/><path d="M2160 385h130" stroke="#b1c5cd" stroke-width="7"/><circle cx="2040" cy="400" r="14" fill="none" stroke="#cba4dc" stroke-width="6"/><path d="M2028 415l-7 15m19-15v20m12-20l7 15" stroke="#cba4dc" stroke-width="3"/><path d="M2210 540q0-37 30-25q30-12 30 25z" fill="#725858" stroke="#d4877b" stroke-width="3"/><circle cx="1980" cy="470" r="14" fill="none" stroke="#cba4dc" stroke-width="6"/><path d="M1968 485l-7 15m19-15v20m12-20l7 15" stroke="#cba4dc" stroke-width="3"/><text x="1730" y="382" class="room">06 被侵蚀的控制层</text><path d="M2250 338l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="2273" y="359" class="tiny" style="fill:#e6bd71">供电闸</text><path d="M1945 305l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="1968" y="326" class="tiny" style="fill:#e6bd71">星骸地标</text><text x="1710" y="267" class="small">改变站位问题，不只是更高血量</text><path d="M2250 372V670H2570V1370H2310" fill="none" stroke="#668778" stroke-width="3" stroke-dasharray="12 9" stroke-linecap="round"/><text x="2400" y="320" class="tiny" style="fill:#89bca3">电力线 / 非道路</text><path d="M2120 700H2220V650H2360V720H2420V920H2310V890H2120Z" class="walk"/><rect x="2180" y="845" width="130" height="45" class="solid"/><path d="M2230 802l15 15l-15 15l-15-15z" fill="#e6bd71"/><text x="2253" y="823" class="tiny" style="fill:#e6bd71">大型设备</text><text x="2140" y="747" class="room">07 吊装区</text><text x="2150" y="784" class="tiny">先看运输路，再拿货</text><path d="M1990 815h65" stroke="#b1c5cd" stroke-width="7"/><path d="M2070 782h65" stroke="#b1c5cd" stroke-width="7"/><text x="1920" y="915" class="tiny" style="fill:#95c7dc">轻装检修口</text><path d="M2100 1280H2360V1450H2060V1390H2100Z" class="walk"/><text x="2105" y="1320" class="room">货运撤离站</text><rect x="2280" y="1360" width="40" height="90" fill="#7bb89e"/><text x="2110" y="1478" class="tiny">供电后可用；不凭空刷守点波</text><path d="M1200 1440V1515" stroke="#e6bd71" stroke-width="9"/><text x="1200" y="1560" class="small" style="fill:#e6bd71">远侧开门 → 认出观察口</text><g id="cargo-layer"><path d="M2210 885L2150 950H1818V1070L2130 1300H2230" fill="none" stroke="#89d0b1" stroke-width="6" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#green)"/><path d="M2350 889H2460V950L2360 1040V1160L2450 1250V1400H2330" fill="none" stroke="#89d0b1" stroke-width="6" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#green)"/><text x="1818" y="1020" class="small" style="fill:#89d0b1">短路：重走泵厅侧缘</text><text x="2430" y="1100" class="small" style="fill:#89d0b1">长路</text><text x="2430" y="1135" class="tiny" style="fill:#89d0b1">外装卸廊</text><text x="1910" y="1165" class="small" style="fill:#89d0b1">08 带货回程：绕行 / 放下战斗 / 弃货</text></g><g id="ecology-layer"><path d="M915 1475H1080L1140 1370L1260 1175H1310" fill="none" stroke="#ed9281" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#red)"/><path d="M1235 1180L1140 1370L1070 1470" fill="none" stroke="#ed9281" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#red)"/><text x="1210" y="1367" class="tiny" style="fill:#ed9281">食物通道：允许真实地面迁移</text><path d="M1290 1150H1530" fill="none" stroke="#ed9281" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#red)"/></g><text x="100" y="1190" class="room" style="fill:#e6bd71">前段：快速接敌 → 试能力 → 看懂生态</text><text x="100" y="1230" class="small">左路选择介入与绕行；右路选择交战与搜索。</text><text x="100" y="1262" class="small">泵厅是第一次发挥，不是第一分钟就互秒。</text><text x="100" y="1294" class="small">两边都能养成构筑，不设置必需器官钥匙。</text><text x="420" y="630" class="room" style="fill:#9db4c0">泵站主体 / 未开放结构</text><text x="420" y="668" class="small" style="fill:#9db4c0">本次可探索区域沿设施右侧向上展开。</text><text x="470" y="800" class="tiny" style="fill:#9db4c0">比例待定：此图审核构成与相邻关系。</text><text x="60" y="1700" class="room" style="fill:#e6bd71">看图顺序</text><text x="60" y="1738" class="note">从左下气闸出发，沿维修工位到观察口；选左维修路或右装卸道，汇入中部泵厅。</text><text x="60" y="1774" class="note">从值守台上探控制层，恢复供电；吊装区拿货后沿绿线回到右下货运站，或弃货返回气闸。</text><text x="60" y="1827" class="small" style="fill:#9db4c0">图中空间是手工逐处绘制；跳跃高差、坡面、碰撞和敌人寻路还须在实施阶段验证。</text><text x="60" y="1864" class="small" style="fill:#9db4c0">本图不保证每局出现成熟怪或 Apex。清理食物、清巢或早撤，应允许一次平静的回程。</text><text x="2010" y="1700" class="room" style="fill:#e6bd71">图例</text><text x="2010" y="1738" class="small">△ 猎手　● 幼体　◇ 收益</text><text x="2010" y="1774" class="small" style="fill:#ed9281">红虚线：生态通路意图</text><text x="2010" y="1810" class="small" style="fill:#89d0b1">绿虚线：两条搬运回程</text><text x="2010" y="1846" class="small" style="fill:#96d1e6">蓝虚线：观察窗（不可穿过）</text></svg>
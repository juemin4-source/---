fill="#526b79"/><rect x="1088" y="470" width="24" height="14" fill="#526b79"/><rect x="1112" y="478" width="24" height="14" fill="#526b79"/><rect x="1136" y="486" width="24" height="14" fill="#526b79"/><rect x="1160" y="494" width="24" height="14" fill="#526b79"/><polyline points="875,445 875,613" fill="none" stroke="#8ab9ba" stroke-width="2" stroke-dasharray="5 4"/><rect x="856" y="582" width="38" height="5" fill="#9cb6c2"/><text x="819" y="568" font-size="13" style="fill:#9ed2c1">货梯</text><text x="535" y="1124" font-size="17" style="fill:#dce6eb">01 气闸 / 撤离</text><text x="490" y="955" font-size="17" style="fill:#dce6eb">02 维修间</text><text x="185" y="968" font-size="17" style="fill:#dce6eb">03 值班室</text><text x="906" y="972" font-size="17" style="fill:#dce6eb">04 分拣车间</text><text x="85" y="762" font-size="17" style="fill:#dce6eb">05 排水沟</text><text x="482" y="733" font-size="17" style="fill:#dce6eb">06 主泵厅</text><text x="913" y="742" font-size="17" style="fill:#dce6eb">07 仓储栈道</text><text x="85" y="548" font-size="17" style="fill:#dce6eb">08 滤水机房</text><text x="480" y="558" font-size="17" style="fill:#dce6eb">09 观察夹层</text><text x="995" y="530" font-size="17" style="fill:#dce6eb">10 货运撤离</text><text x="80" y="333" font-size="17" style="fill:#dce6eb">11 温床</text><text x="485" y="343" font-size="17" style="fill:#dce6eb">12 换热室</text><text x="905" y="333" font-size="17" style="fill:#dce6eb">13 吊装间</text><text x="145" y="168" font-size="17" style="fill:#dce6eb">14 资料库</text><text x="485" y="163" font-size="17" style="fill:#dce6eb">15 外环</text><text x="935" y="164" font-size="17" style="fill:#dce6eb">16 控制室</text><circle cx="560" cy="1158" r="5" fill="#f0e8d5"/><path d="M560 1163v10m0-7l-7 6m7-6l7 6m-7 1l-6 7m6-7l6 7" stroke="#f0e8d5" stroke-width="3"/><path d="M690 1015l13 22h-26z" fill="#dd8e7e"/><path d="M752 949l10 10l-10 10l-10-10z" fill="#e4c47c"/><path d="M230 1012l10 10l-10 10l-10-10z" fill="#e4c47c"/><ellipse cx="100" cy="855" rx="20" ry="11" fill="#785958" stroke="#da9185" stroke-width="2"/><polyline points="231,861 238,855 249,861" fill="none" stroke="#b79ca1" stroke-width="5"/><circle cx="190" cy="856" r="8" fill="#b6b184"/><path d="M335 841l13 22h-26z" fill="#dd8e7e"/><circle cx="515" cy="854" r="8" fill="#b6b184"/><polyline points="671,859 678,853 689,859" fill="none" stroke="#b79ca1" stroke-width="5"/><path d="M758 794l13 22h-26z" fill="#dd8e7e"/><path d="M955 851l13 22h-26z" fill="#dd8e7e"/><path d="M1135 728l10 10l-10 10l-10-10z" fill="#e4c47c"/><ellipse cx="145" cy="436" rx="20" ry="11" fill="#785958" stroke="#da9185" stroke-width="2"/><polyline points="286,442 293,436 304,442" fill="none" stroke="#b79ca1" stroke-width="5"/><ellipse cx="740" cy="231" rx="20" ry="11" fill="#785958" stroke="#da9185" stroke-width="2"/><path d="M1080 427l10 10l-10 10l-10-10z" fill="#e4c47c"/><path d="M305 223l10 10l-10 10l-10-10z" fill="#e4c47c"/><path d="M1150 214l10 10l-10 10l-10-10z" fill="#e4c47c"/><polyline points="425,992 425,1024" fill="none" stroke="#dfc37b" stroke-width="5"/><text x="420" y="983" font-size="16" style="fill:#dfc37b">A</text><polyline points="850,829 850,861" fill="none" stroke="#dfc37b" stroke-width="5"/><text x="845" y="820" font-size="16" style="fill:#dfc37b">B</text><polyline points="850,609 850,641" fill="none" stroke="#dfc37b" stroke-width="5"/><text x="845" y="600" font-size="16" style="fill:#dfc37b">C</text><polyline points="515,636 615,636" fill="none" stroke="#a2cee0" stroke-width="5" stroke-dasharray="9 5"/><text x="483" y="675" font-size="13" style="fill:#a2cee0">观察窗 ↓</text><polyline points="190,856 240,856 335,856" fill="none" stroke="#df9487" stroke-width="2" stroke-dasharray="5 5"/><polyline points="955,860 1040,860 1080,824" fill="none" stroke="#df9487" stroke-width="2" stroke-dasharray="5 5"/><text x="55" y="1200" font-size="15" style="fill:#dce6eb">整体是连续建筑剖面。内部横条是落脚点；大块黑色是实体设备 / 墙体，不是空白背景。</text><text x="1290" y="150" font-size="22" style="fill:#e3c889">读图</text><text x="1290" y="182" font-size="15" style="fill:#dce6eb">浅蓝：可行走空间</text><text x="1290" y="208" font-size="15" style="fill:#dce6eb">黑色：实体建筑 / 设备</text><text x="1290" y="234" font-size="15" style="fill:#dce6eb">灰实线：实体落脚点</text><text x="1290" y="260" font-size="15" style="fill:#dce6eb">浅细线：可穿越跳台</text><text x="1290" y="286" font-size="15" style="fill:#dce6eb">金色 A/B/C：远侧开门</text><text x="1290" y="312" font-size="15" style="fill:#dce6eb">红三角：猎手  圆点：幼体</text><text x="1290" y="338" font-size="15" style="fill:#dce6eb">金菱形：资源  椭圆：巢穴</text><text x="1290" y="396" font-size="22" style="fill:#e3c889">路线意图</text><text x="1290" y="428" font-size="15" style="fill:#dce6eb">下部先横向展开，再逐层上探。</text><text x="1290" y="454" font-size="15" style="fill:#dce6eb">下环 02→06→07→04→02</text><text x="1290" y="480" font-size="15" style="fill:#dce6eb">左环 06→09→08→05→06</text><text x="1290" y="506" font-size="15" style="fill:#dce6eb">上环 09→12→13→10→09</text><text x="1290" y="532" font-size="15" style="fill:#dce6eb">资料库为额外探索回报。</text><text x="1290" y="590" font-size="22" style="fill:#e3c889">尺度待物理校准</text><text x="1290" y="622" font-size="15" style="fill:#dce6eb">目标整图约 8–10 屏宽，</text><text x="1290" y="648" font-size="15" style="fill:#dce6eb">5–6 屏高，不按这张图等比放大。</text><text x="1290" y="674" font-size="15" style="fill:#dce6eb">单房有长廊、夹层和大空间之分。</text><text x="1290" y="700" font-size="15" style="fill:#dce6eb">普通跳点留余量，不按极限摆。</text><text x="1290" y="758" font-size="22" style="fill:#e3c889">重货回程</text><text x="1290" y="790" font-size="15" style="fill:#dce6eb">13 大型设备 → 缓阶 → 10 撤离。</text><text x="1290" y="816" font-size="15" style="fill:#dce6eb">16 恢复货运供电。</text><text x="1290" y="842" font-size="15" style="fill:#dce6eb">不把重货放进只有跳跃出口的房间。</text><text x="1290" y="900" font-size="22" style="fill:#e3c889">审核边界</text><text x="1290" y="932" font-size="15" style="fill:#dce6eb">本图确认空间和功能关系。</text><text x="1290" y="958" font-size="15" style="fill:#dce6eb">顶部页签可看三个放大房间。</text><text x="1290" y="984" font-size="15" style="fill:#dce6eb">生态箭头是设计意图，</text><text x="1290" y="1010" font-size="15" style="fill:#dce6eb">不代表现有程序已经实现。</text><text x="40" y="1270" font-size="20" style="fill:#a9c4d3">B / 01   总剖面 · 尚未接入游戏，等待审核</text></svg>
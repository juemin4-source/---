ill="none" stroke="#354b57" stroke-width="1"/><polyline points="820,175 820,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="860,175 860,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="900,175 900,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="940,175 940,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="980,175 980,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="1020,175 1020,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="1060,175 1060,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="1100,175 1100,800" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,200 1140,200" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,240 1140,240" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,280 1140,280" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,320 1140,320" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,360 1140,360" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,400 1140,400" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,440 1140,440" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,480 1140,480" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,520 1140,520" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,560 1140,560" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,600 1140,600" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,640 1140,640" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,680 1140,680" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,720 1140,720" fill="none" stroke="#354b57" stroke-width="1"/><polyline points="100,760 1140,760" fill="none" stroke="#354b57" stroke-width="1"/><rect x="60" y="665" width="60" height="135" fill="#293e4b"/><rect x="1130" y="655" width="50" height="145" fill="#293e4b"/><rect x="100" y="600" width="370" height="200" fill="#526b79"/><rect x="470" y="600" width="40" height="200" fill="#526b79"/><rect x="510" y="616" width="40" height="184" fill="#526b79"/><rect x="550" y="632" width="40" height="168" fill="#526b79"/><rect x="590" y="648" width="40" height="152" fill="#526b79"/><rect x="630" y="664" width="40" height="136" fill="#526b79"/><rect x="670" y="680" width="40" height="120" fill="#526b79"/><rect x="710" y="696" width="40" height="104" fill="#526b79"/><rect x="750" y="712" width="40" height="88" fill="#526b79"/><rect x="790" y="728" width="40" height="72" fill="#526b79"/><rect x="830" y="744" width="40" height="56" fill="#526b79"/><rect x="870" y="760" width="40" height="40" fill="#526b79"/><rect x="910" y="776" width="40" height="24" fill="#526b79"/><rect x="370" y="400" width="200" height="5" fill="#9cb6c2"/><rect x="700" y="335" width="170" height="5" fill="#9cb6c2"/><rect x="980" y="415" width="130" height="5" fill="#9cb6c2"/><circle cx="205" cy="573" r="5" fill="#f0e8d5"/><path d="M205 578v10m0-7l-7 6m7-6l7 6m-7 1l-6 7m6-7l6 7" stroke="#f0e8d5" stroke-width="3"/><path d="M330 574l10 10l-10 10l-10-10z" fill="#e4c47c"/><path d="M1035 772l13 22h-26z" fill="#dd8e7e"/><rect x="1050" y="690" width="60" height="110" fill="#4a786e"/><text x="1020" y="673" font-size="18" style="fill:#a3d9c1">货运出口</text><polyline points="355,575 445,575 960,770 1055,770" fill="none" stroke="#9dcfb9" stroke-width="4" stroke-dasharray="10 7"/><text x="140" y="562" font-size="19" style="fill:#e3c888">吊装设备 · 拿起前能看见运输路</text><text x="500" y="900" font-size="18" style="fill:#dce6eb"></text><text x="1220" y="180" font-size="22" style="fill:#e3c889">功能标记</text><circle cx="1240" cy="213" r="5" fill="#f0e8d5"/><path d="M1240 218v10m0-7l-7 6m7-6l7 6m-7 1l-6 7m6-7l6 7" stroke="#f0e8d5" stroke-width="3"/><text x="1270" y="229" font-size="19" style="fill:#dce6eb">玩家观察位置</text><path d="M1240 282l13 22h-26z" fill="#dd8e7e"/><text x="1270" y="299" font-size="19" style="fill:#dce6eb">猎手</text><circle cx="1240" cy="367" r="8" fill="#b6b184"/><text x="1270" y="369" font-size="19" style="fill:#dce6eb">食腐幼体</text><polyline points="1231,442 1238,436 1249,442" fill="none" stroke="#b79ca1" stroke-width="5"/><text x="1270" y="439" font-size="19" style="fill:#dce6eb">可进食尸骸</text><path d="M1240 494l10 10l-10 10l-10-10z" fill="#e4c47c"/><text x="1270" y="509" font-size="19" style="fill:#dce6eb">资源目标</text><ellipse cx="1240" cy="576" rx="20" ry="11" fill="#785958" stroke="#da9185" stroke-width="2"/><text x="1270" y="579" font-size="19" style="fill:#dce6eb">栖息 / 出生点</text><text x="80" y="950" font-size="25" style="fill:#e3c889">这间房要让玩家做什么</text><text x="80" y="1000" font-size="22" style="fill:#dce6eb">1. 重货线：缓阶连续落脚，运输不依赖跳跃或爬梯。</text><text x="80" y="1049" font-size="22" style="fill:#dce6eb">2. 轻装线：走上方短跳路线，能快速侦察出口。</text><text x="80" y="1098" font-size="22" style="fill:#dce6eb">3. 拿起设备前即可观察运输方向；可放下货物再战斗。</text><text x="80" y="1147" font-size="22" style="fill:#dce6eb">4. 电力在控制室恢复，出口旁不安排凭空生成的防守波。</text><text x="80" y="1257" font-size="18" style="fill:#9db5c2">角色轮廓仅示意。格子、高差和门洞需按实际角色尺寸进行物理验证；当前不作为碰撞数据。</text></svg>
10" stroke="#283e4b" stroke-width="30" fill="none" stroke-linejoin="round"/><path d="M190 395 V350 H295 V305" stroke="#8a9ba8" stroke-width="38" fill="none" stroke-linejoin="round"/><path d="M190 395 V350 H295 V305" stroke="#283e4b" stroke-width="30" fill="none" stroke-linejoin="round"/><path d="M640 385 V340 H740 V300" stroke="#8a9ba8" stroke-width="38" fill="none" stroke-linejoin="round"/><path d="M640 385 V340 H740 V300" stroke="#283e4b" stroke-width="30" fill="none" stroke-linejoin="round"/><path d="M1060 385 V350 H1150 V300" stroke="#8a9ba8" stroke-width="38" fill="none" stroke-linejoin="round"/><path d="M1060 385 V350 H1150 V300" stroke="#283e4b" stroke-width="30" fill="none" stroke-linejoin="round"/><path d="M385 240 H495" stroke="#8a9ba8" stroke-width="38" fill="none" stroke-linejoin="round"/><path d="M385 240 H495" stroke="#283e4b" stroke-width="30" fill="none" stroke-linejoin="round"/><path d="M800 240 H955" stroke="#8a9ba8" stroke-width="38" fill="none" stroke-linejoin="round"/><path d="M800 240 H955" stroke="#283e4b" stroke-width="30" fill="none" stroke-linejoin="round"/><path d="M140 230 H55 V680 H90" stroke="#8a9ba8" stroke-width="38" fill="none" stroke-linejoin="round"/><path d="M140 230 H55 V680 H90" stroke="#283e4b" stroke-width="30" fill="none" stroke-linejoin="round"/><rect x="540" y="1280" width="210" height="100" rx="5" fill="#263f43" stroke="#a4b4be" stroke-width="3"/><text x="554" y="1309" class="room">01  底部气闸</text><text x="554" y="1334" class="sub">出发 / 稳定撤离</text><rect x="557" y="1345" width="13" height="17" fill="#91c4ae"/><rect x="500" y="1080" width="270" height="145" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="514" y="1109" class="room">02  入站维修间</text><text x="514" y="1134" class="sub">首战 · 低风险器官</text><path d="M518 1207h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><rect x="245" y="1080" width="190" height="110" rx="5" fill="#263f43" stroke="#a4b4be" stroke-width="3"/><text x="259" y="1109" class="room">03  旧值班室</text><text x="259" y="1134" class="sub">书籍 / 医疗 · 休整</text><rect x="262" y="1155" width="13" height="17" fill="#91c4ae"/><rect x="875" y="1080" width="310" height="125" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="889" y="1109" class="room">04  分拣车间</text><text x="889" y="1134" class="sub">具体零件 / 第一处分支</text><path d="M893 1187h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><rect x="80" y="855" width="295" height="155" rx="5" fill="#403b40" stroke="#a4b4be" stroke-width="3"/><text x="94" y="884" class="room">05  排水沟</text><text x="94" y="909" class="sub">食腐幼体 · 尸骸聚集</text><circle cx="348" cy="982" r="13" fill="#d1847e"/><text x="94" y="990" class="tag" style="fill:#e4aaa3">巢 / 食物区</text><rect x="465" y="825" width="320" height="170" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="479" y="854" class="room">06  主泵厅</text><text x="479" y="879" class="sub">战斗核心 · 上下两条路径</text><path d="M483 977h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><rect x="905" y="830" width="290" height="145" rx="5" fill="#403b40" stroke="#a4b4be" stroke-width="3"/><text x="919" y="859" class="room">07  仓储栈道</text><text x="919" y="884" class="sub">工业猎手 / 可见高处宝箱</text><circle cx="1168" cy="947" r="13" fill="#d1847e"/><text x="919" y="955" class="tag" style="fill:#e4aaa3">巢 / 食物区</text><rect x="90" y="615" width="255" height="145" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="104" y="644" class="room">08  滤水机房</text><text x="104" y="669" class="sub">绕机械掩体 / 可观察进食</text><path d="M108 742h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><rect x="470" y="610" width="300" height="120" rx="5" fill="#263f43" stroke="#a4b4be" stroke-width="3"/><text x="484" y="639" class="room">09  观察夹层</text><text x="484" y="664" class="sub">隔窗观察 · 短暂停歇</text><rect x="487" y="695" width="13" height="17" fill="#91c4ae"/><rect x="1025" y="610" width="215" height="130" rx="5" fill="#263f43" stroke="#a4b4be" stroke-width="3"/><text x="1039" y="639" class="room">10  货运站</text><text x="1039" y="664" class="sub">供电后撤离 / 接收重货</text><rect x="1042" y="705" width="13" height="17" fill="#91c4ae"/><rect x="70" y="395" width="270" height="155" rx="5" fill="#403b40" stroke="#a4b4be" stroke-width="3"/><text x="84" y="424" class="room">11  旧生体温床</text><text x="84" y="449" class="sub">争食区 · 猎手与幼体相遇</text><circle cx="313" cy="522" r="13" fill="#d1847e"/><text x="84" y="530" class="tag" style="fill:#e4aaa3">巢 / 食物区</text><rect x="465" y="385" width="300" height="145" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="479" y="414" class="room">12  中央换热室</text><text x="479" y="439" class="sub">精英交汇 / 多掩体战斗</text><path d="M483 512h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><rect x="915" y="385" width="300" height="145" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="929" y="414" class="room">13  设备吊装间</text><text x="929" y="439" class="sub">大型设备 / 货运路线起点</text><path d="M933 512h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><rect x="140" y="175" width="245" height="130" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="154" y="204" class="room">14  封存资料库</text><text x="154" y="229" class="sub">书籍 · 蓝图 · 可选支路</text><path d="M158 287h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><rect x="495" y="170" width="305" height="130" rx="5" fill="#403b40" stroke="#a4b4be" stroke-width="3"/><text x="509" y="199" class="room">15  反应堆外环</text><text x="509" y="224" class="sub">高收益 / 神造浮游巢</text><circle cx="773" cy="272" r="13" fill="#d1847e"/><text x="509" y="280" class="tag" style="fill:#e4aaa3">巢 / 食物区</text><rect x="955" y="170" width="260" height="130" rx="5" fill="#2b3c49" stroke="#a4b4be" stroke-width="3"/><text x="969" y="199" class="room">16  上层控制室</text><text x="969" y="224" class="sub">电力开关 / 稀有核心</text><path d="M973 282h55v-22h45v-20h45" fill="none" stroke="#718b9c" stroke-width="7"/><path d="M418 1124V1166" stroke="#dcbc78" stroke-width="7"/><text x="410" y="1115" class="room" style="fill:#e6c47d">A</text><path d="M825 904V946" stroke="#dcbc78" stroke-width="7"/><text x="817" y="895" class="room" style="fill:#e6c47d">B</text><path d="M843 532V574" stroke="#dcbc78" stroke-width="7"/><text x="835" y="523" class="room" style="fill:#e6c47d">C</text><text x="354" y="1205" class="small" style="fill:#e6c47d">A：从排水沟侧开门</text><text x="784" y="988" class="small" style="fill:#e6c47d">B：从仓储侧开门</text><text x="820" y="589" class="small" style="fill:#e6c47d">C：吊装间侧打开</text><text x="1055" y="794" class="small">跳跃错层</text><text x="1205" y="790" class="small" style="fill:#8fd0bb">货梯</text><path d="M1260 700V850" fill="none" stroke="#8fd0bb" stroke-width="5" stroke-dasharray="8 5"/><path d="M55 300V580" fill="none" stroke="#c4b2db" stroke-width="4" stroke-dasharray="5 6"/><text x="70" y="587" class="small" style="fill:#c4b2db">唯一维修梯 · 可选返回路</text><path d="M1190 510H985V565H1110V620" fill="none" stroke="#8fd0bb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="920" y="555" class="small" style="fill:#8fd0bb">重货缓阶下行 → 货运站</text><path d="M492 729H593" stroke="#80b9d1" stroke-width="6" stroke-dasharray="10 4"/><text x="472" y="760" class="small" style="fill:#8fbfd3">隔窗看到下方争食</text><path d="M1140 890l10 10l-10 10l-10-10z" fill="#e2c17d"/><text x="1110" y="930" class="small" style="fill:#e2c17d">宝箱兽</text><path d="M715 248l10 10l-10 10l-10-10z" fill="#e2c17d"/><text x="685" y="288" class="small" style="fill:#e2c17d">星骸</text><path d="M320 253l10 10l-10 10l-10-10z" fill="#e2c17d"/><text x="290" y="293" class="small" style="fill:#e2c17d">蓝图</text><path d="M1130 475l10 10l-10 10l-10-10z" fill="#e2c17d"/><text x="1100" y="515" class="small" style="fill:#e2c17d">大型设备</text><path d="M125 972 Q215 925 335 980" fill="none" stroke="#ce8d86" stroke-width="2" stroke-dasharray="5 5"/><path d="M112 520 Q210 455 300 515" fill="none" stroke="#ce8d86" stroke-width="2" stroke-dasharray="5 5"/><path d="M500 970 Q610 875 760 965" fill="none" stroke="#ce8d86" stroke-width="2" stroke-dasharray="5 5"/><path d="M940 949 Q1050 870 1150 943" fill="none" stroke="#ce8d86" stroke-width="2" stroke-dasharray="5 5"/><text x="1340" y="171" class="title">先看这四件事</text><text x="1340" y="210" class="room" style="fill:#e1c48a">01  规模与方向</text><text x="1340" y="239" class="note">16 个主要空间，三层横向展开。</text><text x="1340" y="266" class="note">总体向上深入，局部允许下探。</text><text x="1340" y="293" class="note">目标约 8–10 屏宽、5–6 屏高；</text><text x="1340" y="320" class="note">实际尺寸按镜头与跳跃再校准。</text><text x="1340" y="372" class="room" style="fill:#e1c48a">02  走路、跳跃为主</text><text x="1340" y="401" class="note">普通门洞直接跑过；短高差用跳。</text><text x="1340" y="428" class="note">折返通道内是楼梯或错层落脚点，</text><text x="1340" y="455" class="note">不是每段竖线都配一根梯子。</text><text x="1340" y="482" class="note">三处回环门 A / B / C 从远侧打开。</text><text x="1340" y="534" class="room" style="fill:#e1c48a">03  三条探索回环</text><text x="1340" y="563" class="note">下环：维修间→排水沟→主泵厅</text><text x="1340" y="590" class="note">→仓储→分拣→维修间。</text><text x="1340" y="617" class="note">中环：主泵厅→滤水→温床</text><text x="1340" y="644" class="note">→换热→观察夹层→主泵厅。</text><text x="1340" y="671" class="note">右环：仓储→货运→吊装</text><text x="1340" y="698" class="note">→观察夹层→主泵厅→仓储。</text><text x="1340" y="750" class="room" style="fill:#e1c48a">04  危险能提前看见</text><text x="1340" y="779" class="note">排水沟：幼体在吃可见尸骸。</text><text x="1340" y="806" class="note">温床：猎手进入幼体食物区。</text><text x="1340" y="833" class="note">仓储：工业猎手巡逻守住货物。</text><text x="1340" y="860" class="note">外环：浮游群占据高处。</text><text x="1340" y="887" class="note">红虚线＝局部活动示意；不穿墙。</text><text x="1340" y="939" class="room" style="fill:#e1c48a">资源与回程</text><text x="1340" y="968" class="note">出生点、值班室、观察夹层留喘息。</text><text x="1340" y="995" class="note">大型设备只放在能搬出去的吊装间，</text><text x="1340" y="1022" class="note">经缓阶下行到货运站，无须爬梯。</text><text x="1340" y="1049" class="note">上层控制室恢复货运撤离供电。</text><text x="1340" y="1076" class="note">资料库是可选支路，回报书籍蓝图。</text><text x="1340" y="1128" class="room" style="fill:#e1c48a">这张图尚未决定</text><text x="1340" y="1157" class="note">房间内精确跳台、伤害与掉落数值，</text><text x="1340" y="1184" class="note">以及生态进食和争斗的发生频率。</text><text x="1340" y="1211" class="note">先审核：房间分布、路线、规模、</text><text x="1340" y="1238" class="note">探索目标和回程是否符合你的想象。</text><text x="65" y="1420" class="note">起点 ↑　先进入维修间交战，再决定：左边搜旧设施 / 右边走货运线 / 向上进主泵厅</text><text x="45" y="1500" class="note" style="fill:#a4b9c8">草案 A · 仅供布局审核，尚未接入游戏。关卡必须让地形、敌人活动和物资运输共同成立。</text></svg>